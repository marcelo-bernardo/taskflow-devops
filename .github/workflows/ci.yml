name: CI/CD

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  test:
    name: Lint e testes (Python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Lint com flake8
        run: flake8 .

      - name: Auditoria de seguranca das dependencias
        run: pip-audit -r requirements.txt

      - name: Testes com cobertura
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80

      - name: Publicar relatorio de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  terraform:
    name: Validar Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Verificar formatacao
        run: terraform fmt -check -recursive

      - name: Inicializar (sem backend)
        run: terraform init -backend=false

      - name: Validar sintaxe
        run: terraform validate

  docker:
    name: Build e teste do container
    needs: [test, terraform]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Build da imagem
        run: docker build -t taskflow-api:ci .

      - name: Subir o container e testar a API
        run: |
          docker run -d --name taskflow-api -p 5000:5000 taskflow-api:ci
          for i in $(seq 1 10); do
            curl -fs http://localhost:5000/health && break
            sleep 2
          done
          curl -fs http://localhost:5000/health
          curl -fs -X POST -H "Content-Type: application/json" \
            -d '{"title":"teste do container"}' http://localhost:5000/tasks
          docker logs taskflow-api

      - name: Login no GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar imagem (latest e versao do commit)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag taskflow-api:ci $IMAGE_NAME:${{ github.sha }}
          docker tag taskflow-api:ci $IMAGE_NAME:latest
          docker push $IMAGE_NAME:${{ github.sha }}
          docker push $IMAGE_NAME:latest
